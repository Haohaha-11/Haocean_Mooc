[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haocean-mooc-teacher-cli"
version = "0.1.0"
description = "Haocean MOOC teacher terminal client"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
  "textual>=0.50",
]

[project.scripts]
haocean-teacher = "controller.main:main"

[tool.setuptools]
packages = ["controller"]
