[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haocean-mooc-cli"
version = "0.1.0"
description = "Haocean MOOC student terminal client"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.scripts]
haocean = "module_a.main:main"

[tool.setuptools]
packages = ["module_a"]
